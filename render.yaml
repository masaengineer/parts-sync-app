services:
  # Web アプリ
  - type: web
    name: parts-sync-app
    runtime: ruby
    plan: starter
    buildCommand: './bin/render-build.sh'
    startCommand: 'bundle exec puma -C config/puma.rb'

  # Cron : 朝 6 時 JST
  - type: cron
    name: ebay-sync-morning
    runtime: ruby
    plan: pro plus
    schedule: '0 21 * * *' # 21:00 UTC = 06:00 JST
    buildCommand: './bin/cron-build.sh'
    startCommand: 'bundle exec rake ebay:sync_all'

  # Cron : 夕方 18 時 JST
  - type: cron
    name: ebay-sync-evening
    runtime: ruby
    plan: pro plus
    schedule: '0 9 * * *' # 09:00 UTC = 18:00 JST
    buildCommand: './bin/cron-build.sh'
    startCommand: 'bundle exec rake ebay:sync_all'
