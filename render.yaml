services:
  # Web アプリ
  - type: web
    name: parts-sync-app
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

  # Cron : 朝 6 時 JST
  - type: cron
    name: ebay-sync-morning
    runtime: ruby
    schedule: "0 21 * * *"   # 21:00 UTC = 06:00 JST
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

  # Cron : 昼 14 時 JST
  - type: cron
    name: ebay-sync-afternoon
    runtime: ruby
    schedule: "0 5 * * *"    # 05:00 UTC = 14:00 JST
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

  # Cron : 夜 20 時 JST
  - type: cron
    name: ebay-sync-evening
    runtime: ruby
    schedule: "0 11 * * *"   # 11:00 UTC = 20:00 JST
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: parts-sync-app-db2
    databaseName: parts_sync_production
    user: parts_sync
