services:
  - type: web
    name: parts-sync-app
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: parts-sync-app-db2
    databaseName: parts_sync_production
    user: parts_sync

# Cron Jobs for eBay sync
crons:
  - name: ebay-sync-morning
    schedule: "0 21 * * *"  # 毎日朝6時 JST (21:00 UTC = 6:00 JST)
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    env: ruby
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
  
  - name: ebay-sync-afternoon
    schedule: "0 5 * * *"  # 毎日昼14時 JST (05:00 UTC = 14:00 JST)
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    env: ruby
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
  
  - name: ebay-sync-evening
    schedule: "0 11 * * *"  # 毎日夜20時 JST (11:00 UTC = 20:00 JST)
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake ebay:sync_all"
    env: ruby
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parts-sync-app-db2
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false